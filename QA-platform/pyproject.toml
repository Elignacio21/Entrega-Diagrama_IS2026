[project]
name = "qa-platform"
version = "0.1.0"
description = "Plataforma colaborativa de preguntas y respuestas (Q&A) para estudiantes universitarios"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
